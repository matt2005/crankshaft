# Crankshaft Layer Configuration for rpi-image-gen
# This file defines the Crankshaft-specific build configuration

# Layer metadata
LAYER_NAME="crankshaft"
LAYER_VERSION="5.0.0"
LAYER_DESCRIPTION="Crankshaft - Android Auto and CarPlay for Raspberry Pi"

# Stage configuration
STAGE_LIST="stage0 stage1 stage2-crankshaft"

# Export configuration  
EXPORT_DIR="${LAYER_DIR}/export"
EXPORT_IMAGE=1
EXPORT_NOOBS=0

# Image configuration inherited from config
# These can be overridden in the main config file
IMG_NAME="${IMG_NAME:-crankshaft-ng}"
IMG_DATE="${IMG_DATE:-$(date +%Y-%m-%d)}"

# Crankshaft specific build options
CRANKSHAFT_VERSION="${CRANKSHAFT_VERSION:-5.0.0}"
CRANKSHAFT_BUILD_TYPE="${CRANKSHAFT_BUILD_TYPE:-release}"

# Target platform
TARGET_ARCH="${TARGET_ARCH:-arm64}"
DEBIAN_RELEASE="${DEBIAN_RELEASE:-bookworm}"

# User configuration
FIRST_USER_NAME="${FIRST_USER_NAME:-pi}"
FIRST_USER_PASS="${FIRST_USER_PASS:-raspberry}"

# Enable required features for Crankshaft
ENABLE_SSH="${ENABLE_SSH:-0}"
STAGE_LIST="${STAGE_LIST} stage2-crankshaft"

# Hardware features needed by Crankshaft
ENABLE_GPIO="${ENABLE_GPIO:-1}"
ENABLE_I2C="${ENABLE_I2C:-1}"
ENABLE_SPI="${ENABLE_SPI:-1}"
ENABLE_CAMERA="${ENABLE_CAMERA:-1}"

# Audio configuration
ENABLE_PULSEAUDIO="${ENABLE_PULSEAUDIO:-1}"
AUDIO_OUTPUT="${AUDIO_OUTPUT:-auto}"

# GPU memory for hardware acceleration
GPU_MEM="${GPU_MEM:-128}"

# Network configuration
ENABLE_HOTSPOT="${ENABLE_HOTSPOT:-1}"
ENABLE_BLUETOOTH="${ENABLE_BLUETOOTH:-1}"

# Build system
WORK_DIR="${WORK_DIR:-work}"
DEPLOY_DIR="${DEPLOY_DIR:-deploy}"
VERBOSE="${VERBOSE:-0}"
