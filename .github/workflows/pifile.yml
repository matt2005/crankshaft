name: "Crankshaft Build"

# Crankshaft automated build using official Raspberry Pi rpi-image-gen
# Builds both arm64 and armhf versions for Debian Bookworm
# Generates release artifacts with checksums and optional SBOM
# 
# This workflow uses the latest versions of GitHub Actions and best practices:
# - actions/checkout@v4
# - docker/setup-buildx-action@v3
# - docker/setup-qemu-action@v3
# - actions/upload-artifact@v4
# - mikepenz/release-changelog-builder-action@v5
# - svenstaro/upload-release-action@v2

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty for auto-generation)'
        required: false
        type: string
      architecture:
        description: 'Target Architecture'
        required: false
        default: 'both'
        type: choice
        options:
        - both
        - arm64
        - armhf
      debian_release:
        description: 'Debian Release'
        required: false
        default: 'bookworm'
        type: choice
        options:
        - bookworm
        - bullseye
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

# Ensure only one build runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for the workflow
permissions:
  contents: write
  packages: read
  pull-requests: read
jobs:
  version:
    name: "Generate version info"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      buildname: ${{ steps.get_version.outputs.buildname }}
      builddate: ${{ steps.get_version.outputs.builddate }}
      buildbranch: ${{ steps.get_version.outputs.buildbranch }}
      buildhash: ${{ steps.get_version.outputs.buildhash }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for accurate version generation
      
      - name: "Generate version information"
        id: get_version
        run: |
          # Generate version based on input or auto-generate
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${{ github.ref_name }}"
          else
            version=$(date '+%Y%m%d-%H%M%S')
          fi
          
          # Clean version string (remove v prefix if present)
          version=${version#v}
          
          # Generate build metadata
          builddate=$(date -u '+%Y-%m-%d')
          buildbranch="${{ github.ref_name }}"
          buildhash=$(git rev-parse --short "$GITHUB_SHA")
          buildname="crankshaft-ng-${builddate}-${buildhash}"
          
          # Set outputs
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "builddate=${builddate}" >> $GITHUB_OUTPUT
          echo "buildbranch=${buildbranch}" >> $GITHUB_OUTPUT
          echo "buildhash=${buildhash}" >> $GITHUB_OUTPUT
          echo "buildname=${buildname}" >> $GITHUB_OUTPUT
          
          # Debug output
          echo "Generated version: ${version}"
          echo "Build date: ${builddate}"
          echo "Build branch: ${buildbranch}"
          echo "Build hash: ${buildhash}"
          echo "Build name: ${buildname}"
  build:
    name: "Build ${{ matrix.config.name }}"
    runs-on: ubuntu-22.04
    needs: [version]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        config:
          - {
              name: "Debian Bookworm arm64",
              arch: "arm64",
              osname: "bookworm",
              ostype: "Debian",
              platforms: "linux/arm64"
            }
          - {
              name: "Debian Bookworm armhf",
              arch: "armhf", 
              osname: "bookworm",
              ostype: "Debian",
              platforms: "linux/arm/v7"
            }
    
    outputs:
      artifact-name: ${{ steps.build_info.outputs.artifact_name || steps.skip_outputs.outputs.artifact_name }}
      image-file: ${{ steps.build_info.outputs.image_file || steps.skip_outputs.outputs.image_file }}
    
    steps:
      - name: "Check architecture filter"
        id: arch_filter
        run: |
          REQUESTED_ARCH="${{ github.event.inputs.architecture }}"
          CURRENT_ARCH="${{ matrix.config.arch }}"
          
          # Skip if specific architecture requested and this isn't it
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "$REQUESTED_ARCH" != "both" ]] && \
             [[ "$REQUESTED_ARCH" != "" ]] && \
             [[ "$REQUESTED_ARCH" != "$CURRENT_ARCH" ]]; then
            echo "Skipping $CURRENT_ARCH build (requested: $REQUESTED_ARCH)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Building $CURRENT_ARCH"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: "Set skip outputs"
        if: steps.arch_filter.outputs.skip == 'true'
        id: skip_outputs
        run: |
          echo "Architecture ${{ matrix.config.arch }} was skipped"
          echo "artifact_name=skipped-${{ matrix.config.arch }}" >> $GITHUB_OUTPUT
          echo "image_file=skipped-${{ matrix.config.arch }}.img" >> $GITHUB_OUTPUT

      - name: "Checkout repository"
        if: steps.arch_filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Docker Buildx"
        if: steps.arch_filter.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.config.platforms }}

#      - name: "Set up QEMU"
#        if: steps.arch_filter.outputs.skip != 'true'
#        uses: docker/setup-qemu-action@v3
#        with:
#          platforms: ${{ matrix.config.platforms }}

      - name: "Setup additional QEMU and binfmt"
        if: steps.arch_filter.outputs.skip != 'true'
        run: |
          # Set up QEMU with binfmt registration for cross-compilation
          echo "Setting up QEMU and binfmt for cross-compilation..."
          
          # Check if binfmt_misc module is loaded
          echo "Checking binfmt_misc kernel module..."
          if ! lsmod | grep -q binfmt_misc; then
            echo "binfmt_misc module not loaded, attempting to load it..."
            sudo modprobe binfmt_misc 2>/dev/null || {
              echo "Could not load binfmt_misc module"
              echo "This might be due to:"
              echo "  - Running in a container without module loading privileges"
              echo "  - Kernel without binfmt_misc support"
              echo "  - Security restrictions"
              echo "Will attempt alternative QEMU setup..."
            }
          else
            echo "binfmt_misc module already loaded"
          fi
          
          # Ensure binfmt_misc filesystem is mounted
          echo "Checking binfmt_misc filesystem..."
          if [ ! -d "/proc/sys/fs/binfmt_misc" ]; then
            echo "Mounting binfmt_misc filesystem..."
            sudo mkdir -p /proc/sys/fs/binfmt_misc 2>/dev/null || true
            sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || {
              echo "Could not mount binfmt_misc filesystem"
              echo "Will use Docker's built-in QEMU support instead"
            }
          else
            echo "binfmt_misc filesystem already mounted"
          fi
          
          # Register QEMU binfmt handlers using Docker's multiarch support
          echo "Setting up QEMU emulation..."
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || {
            echo "Standard QEMU registration failed, trying alternative method..."
            
            # Alternative: Use docker buildx which has built-in QEMU support
            docker buildx create --use --name multiarch --driver docker-container 2>/dev/null || true
            docker buildx inspect --bootstrap 2>/dev/null || {
              echo "Docker buildx also failed, but this may still work in privileged containers"
            }
          }
         
          # Verify setup
          echo "Verifying cross-compilation setup:"
          if [ -d "/proc/sys/fs/binfmt_misc" ]; then
            ls -la /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "binfmt_misc not accessible"
            
            # Check for specific architecture handlers
            if [[ "${{ matrix.config.arch }}" == "arm64" ]]; then
              if [ -f "/proc/sys/fs/binfmt_misc/qemu-aarch64" ]; then
                echo "✓ ARM64 (aarch64) QEMU handler registered"
                cat /proc/sys/fs/binfmt_misc/qemu-aarch64 | head -5
              else
                echo "⚠ ARM64 QEMU handler not found in binfmt_misc"
              fi
            elif [[ "${{ matrix.config.arch }}" == "armhf" ]]; then
              if [ -f "/proc/sys/fs/binfmt_misc/qemu-arm" ]; then
                echo "✓ ARMHF (arm) QEMU handler registered"
                cat /proc/sys/fs/binfmt_misc/qemu-arm | head -5
              else
                echo "⚠ ARMHF QEMU handler not found in binfmt_misc"
              fi
            fi
          else
            echo "binfmt_misc not available, relying on Docker's privileged mode for emulation"
          fi
          
          # Test basic QEMU functionality
          echo "Testing QEMU emulation..."
          if [[ "${{ matrix.config.arch }}" == "arm64" ]]; then
            echo "Testing arm64 emulation:"
            docker run --rm --platform linux/arm64 hello-world 2>/dev/null && echo "✓ ARM64 emulation working" || echo "⚠ ARM64 emulation test failed"
          elif [[ "${{ matrix.config.arch }}" == "armhf" ]]; then
            echo "Testing armhf emulation:"
            docker run --rm --platform linux/arm/v7 hello-world 2>/dev/null && echo "✓ ARMHF emulation working" || echo "⚠ ARMHF emulation test failed"
          fi
#          
#          # Check for specific architecture handlers
#          if [[ "${{ matrix.config.arch }}" == "arm64" ]]; then
#            if [ -f "/proc/sys/fs/binfmt_misc/qemu-aarch64" ]; then
#              echo "✓ ARM64 (aarch64) binfmt handler registered"
#              cat /proc/sys/fs/binfmt_misc/qemu-aarch64 | head -5
#            else
#              echo "⚠ ARM64 binfmt handler not found"
#            fi
#          elif [[ "${{ matrix.config.arch }}" == "armhf" ]]; then
#            if [ -f "/proc/sys/fs/binfmt_misc/qemu-arm" ]; then
#              echo "✓ ARMHF (arm) binfmt handler registered"
#              cat /proc/sys/fs/binfmt_misc/qemu-arm | head -5
#            else
#              echo "⚠ ARMHF binfmt handler not found"
#            fi
#          fi
          
#          # Test architecture support
#          if [[ "${{ matrix.config.arch }}" == "arm64" ]]; then
#            echo "Testing ARM64 emulation:"
#            docker run --rm --platform=linux/arm64 arm64v8/alpine:latest uname -a || echo "ARM64 test failed"
#          elif [[ "${{ matrix.config.arch }}" == "armhf" ]]; then
#            echo "Testing ARMHF emulation:"
#            docker run --rm --platform=linux/arm/v7 arm32v7/alpine:latest uname -a || echo "ARMHF test failed"
#          fi

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: "Generate build information"
        if: steps.arch_filter.outputs.skip != 'true'
        id: build_info
        run: |
          # Build artifact naming
          version="${{ needs.version.outputs.version }}"
          arch="${{ matrix.config.arch }}"
          osname="${{ matrix.config.osname }}"
          ostype="${{ matrix.config.ostype }}"
          
          if [ -n "$ostype" ]; then 
            full_osname="${ostype}_${osname}"
          else
            full_osname="${osname}"
          fi
          
          artifact_name="${version}-${full_osname}-${arch}"
          image_file="${artifact_name}.img"
          
          echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
          echo "image_file=${image_file}" >> $GITHUB_OUTPUT
          echo "version_tag=${version}" >> $GITHUB_OUTPUT
          
          echo "Build artifact: ${artifact_name}"
          echo "Image file: ${image_file}"

      - name: "Setup build environment"
        if: steps.arch_filter.outputs.skip != 'true'
        run: |
          # Update system
          sudo apt-get update
          
          # Install required packages for cross-compilation
          sudo apt-get install -y \
            qemu-user-static \
            binfmt-support \
            debootstrap \
            systemd-container \
            zip \
            curl
          
          # Verify binfmt support
          echo "Available binfmt interpreters:"
          ls -la /proc/sys/fs/binfmt_misc/ || true
          
          # Configure Docker for experimental features
          echo '{"experimental": true, "features": {"buildkit": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          
          # Wait for Docker to restart
          sleep 5
          
          # Generate configuration file
          cat > config << EOF
          # Crankshaft CI Build Configuration - Generated $(date -u)
          IMG_NAME='crankshaft-ng'
          TARGET_ARCH='${{ matrix.config.arch }}'
          DEBIAN_RELEASE='${{ matrix.config.osname }}'
          FIRST_USER_NAME='pi'
          FIRST_USER_PASS='raspberry'
          ENABLE_SSH=0
          DEPLOY_ZIP=1
          VERBOSE=1
          
          # Build metadata
          BUILD_VERSION='${{ needs.version.outputs.version }}'
          BUILD_DATE='${{ needs.version.outputs.builddate }}'
          BUILD_BRANCH='${{ needs.version.outputs.buildbranch }}'
          BUILD_HASH='${{ needs.version.outputs.buildhash }}'
          EOF
          
          echo "Generated config file:"
          cat config
      - name: "Validate build environment"
        if: steps.arch_filter.outputs.skip != 'true'
        run: |
          # Run validation script if available
          if [ -f "./scripts/validate-rpi-image-gen.sh" ]; then
            chmod +x ./scripts/validate-rpi-image-gen.sh
            ./scripts/validate-rpi-image-gen.sh || echo "Validation script failed, continuing anyway"
          else
            echo "No validation script found at ./scripts/validate-rpi-image-gen.sh"
          fi
          
          # Verify Docker and buildx
          echo "=== Docker Version ==="
          docker --version
          echo "=== Docker Info ==="
          docker info
          echo "=== Docker Buildx Version ==="
          docker buildx version
          
          # Verify QEMU is working (already set up in previous step)
          echo "=== Verifying QEMU Setup ==="
          if [[ "${{ matrix.config.arch }}" == "arm64" ]]; then
            echo "Verifying ARM64 support..."
            docker run --rm --platform=linux/arm64 arm64v8/alpine:latest echo "ARM64 QEMU working" || echo "ARM64 test failed"
          elif [[ "${{ matrix.config.arch }}" == "armhf" ]]; then
            echo "Verifying ARMHF support..."
            docker run --rm --platform=linux/arm/v7 arm32v7/alpine:latest echo "ARMHF QEMU working" || echo "ARMHF test failed"
          fi
          
          # Check available build scripts
          echo "=== Available Build Scripts ==="
          ls -la *.sh 2>/dev/null || echo "No shell scripts found"

      - name: "Build Crankshaft image"
        if: steps.arch_filter.outputs.skip != 'true'
        id: build
        run: |
          # Set build environment variables
          export VERBOSE=1
          export DOCKER_BUILDKIT=1
          export BUILDX_NO_DEFAULT_ATTESTATIONS=1
          
          # Enable debug mode if requested
          if [[ "${{ github.event.inputs.debug }}" == "true" ]]; then
            export DEBUG=1
            set -x
          fi
          
          echo "Starting rpi-image-gen build for ${{ matrix.config.arch }} on ${{ matrix.config.osname }}"
          echo "Build version: ${{ needs.version.outputs.version }}"
          
          # Ensure build script exists and is executable
          if [ ! -f "./build-docker-rpi-image-gen.sh" ]; then
            echo "ERROR: build-docker-rpi-image-gen.sh not found!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          chmod +x ./build-docker-rpi-image-gen.sh
          
          # Test Docker build first with detailed output
          echo "=== Testing Docker build ==="
          echo "Dockerfile contents:"
          cat Dockerfile
          echo "=== Building Docker image ==="
          if ! docker build --no-cache -t crankshaft-rpi-image-gen .; then
            echo "ERROR: Docker build failed"
            echo "Docker info:"
            docker info
            echo "Docker version:"
            docker version
            echo "Docker system df:"
            docker system df
            echo "Available space:"
            df -h
            echo "Docker build logs (last 100 lines):"
            docker build --no-cache -t crankshaft-rpi-image-gen . 2>&1 | tail -100 || true
            exit 1
          fi
          
          echo "=== Docker build successful ==="
          docker images crankshaft-rpi-image-gen
          
          # Test container startup
          echo "=== Testing container startup ==="
          if ! docker run --rm crankshaft-rpi-image-gen echo "Container test successful"; then
            echo "ERROR: Container startup test failed"
            exit 1
          fi
          
          echo "=== Starting actual build ==="
          
          # Run the build using our Docker wrapper script
          if ! ./build-docker-rpi-image-gen.sh \
            -a "${{ matrix.config.arch }}" \
            -r "${{ matrix.config.osname }}" \
            -v; then
            echo "ERROR: Build script failed"
            echo "=== Checking for container logs ==="
            docker ps -a | grep crankshaft || echo "No containers found"
            exit 1
          fi
            
          # Check if build produced any output
          echo "=== Checking build output ==="
          if [ -d "deploy" ]; then
            echo "Deploy directory contents:"
            ls -la deploy/
          else
            echo "No deploy directory found"
          fi
          
          if [ -d "work" ]; then
            echo "Work directory contents:"
            find work -type f | head -20
          else
            echo "No work directory found"
          fi
          
          echo "=== All files in current directory ==="
          find . -name "*.img" -o -name "*.zip" | head -10
        timeout-minutes: 120
        env:
          DOCKER_BUILDKIT: 1

      - name: "Find and prepare built image"
        if: steps.arch_filter.outputs.skip != 'true'
        id: find_image
        run: |
          echo "=== Searching for built image files ==="
          
          # Show current directory structure
          echo "Current directory contents:"
          ls -la
          
          # Look for image files in multiple locations
          IMG_FILE=""
          for search_dir in deploy work stage*/deploy .; do
            if [ -d "$search_dir" ]; then
              echo "Checking directory: $search_dir"
              find "$search_dir" -name "*.img" -type f | head -10
              IMG_FILE=$(find "$search_dir" -name "*.img" -type f | head -1)
              if [ -n "$IMG_FILE" ]; then
                echo "Found image in $search_dir: $IMG_FILE"
                break
              fi
            fi
          done
          
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No image file found"
            echo "=== Full directory search ==="
            find . -name "*.img" -o -name "*.zip" | head -20
            echo "=== Root directory contents ==="
            ls -la
            echo "=== Deploy directory contents (if exists) ==="
            ls -la deploy/ 2>/dev/null || echo "Deploy directory does not exist"
            echo "=== Work directory contents (if exists) ==="
            ls -la work/ 2>/dev/null || echo "Work directory does not exist"
            exit 1
          fi
          
          echo "Found image file: $IMG_FILE"
          
          # Generate target name using build info
          TARGET_NAME="${{ steps.build_info.outputs.image_file }}"
          echo "Target name: $TARGET_NAME"
          
          # Copy to expected location
          cp "$IMG_FILE" "$TARGET_NAME"
          echo "IMG_FILENAME=${TARGET_NAME}" >> $GITHUB_OUTPUT
          
          # Handle checksum files if they exist
          for ext in md5 sha1 sha256; do
            SRC_FILE=$(find deploy work -name "*.$ext" 2>/dev/null | head -1)
            if [ -f "$SRC_FILE" ]; then
              cp "$SRC_FILE" "${TARGET_NAME}.$ext"
              echo "Copied checksum file: ${TARGET_NAME}.$ext"
            fi
          done
          
          # Show final file information
          echo "=== Build artifacts ==="
          ls -lh "${TARGET_NAME}"* 2>/dev/null || true
          
          # Calculate file size for summary
          if [ -f "$TARGET_NAME" ]; then
            FILE_SIZE=$(du -h "$TARGET_NAME" | cut -f1)
            echo "image_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
            echo "Image size: $FILE_SIZE"
          fi
      - name: "Package release artifacts"
        if: steps.arch_filter.outputs.skip != 'true'
        id: package
        run: |
          IMG_FILENAME="${{ steps.find_image.outputs.IMG_FILENAME }}"
          ARTIFACT_NAME="${{ steps.build_info.outputs.artifact_name }}"
          ZIP_FILENAME="${ARTIFACT_NAME}.zip"
          MD5HASH="${IMG_FILENAME}.md5"
          SHA1HASH="${IMG_FILENAME}.sha1"
          SHA256HASH="${IMG_FILENAME}.sha256"
          
          echo "Packaging artifacts..."
          echo "Image file: $IMG_FILENAME"
          echo "Archive name: $ZIP_FILENAME"
          
          # Generate checksums if they don't exist
          if [ ! -f "${MD5HASH}" ]; then
            echo "Generating MD5 checksum..."
            md5sum "${IMG_FILENAME}" > "${MD5HASH}"
          fi
          if [ ! -f "${SHA1HASH}" ]; then
            echo "Generating SHA1 checksum..."
            sha1sum "${IMG_FILENAME}" > "${SHA1HASH}"
          fi
          if [ ! -f "${SHA256HASH}" ]; then
            echo "Generating SHA256 checksum..."
            sha256sum "${IMG_FILENAME}" > "${SHA256HASH}"
          fi
          
          # Create comprehensive ZIP archive
          echo "Creating ZIP archive..."
          zip -9 "${ZIP_FILENAME}" "${IMG_FILENAME}" "${MD5HASH}" "${SHA1HASH}" "${SHA256HASH}"
          
          # Generate additional metadata file
          cat > "${ARTIFACT_NAME}.json" << EOF
          {
            "version": "${{ needs.version.outputs.version }}",
            "architecture": "${{ matrix.config.arch }}",
            "debian_release": "${{ matrix.config.osname }}",
            "build_date": "${{ needs.version.outputs.builddate }}",
            "build_branch": "${{ needs.version.outputs.buildbranch }}",
            "build_hash": "${{ needs.version.outputs.buildhash }}",
            "image_file": "${IMG_FILENAME}",
            "image_size": "${{ steps.find_image.outputs.image_size || 'unknown' }}",
            "checksums": {
              "md5": "$(cat ${MD5HASH} | cut -d' ' -f1)",
              "sha1": "$(cat ${SHA1HASH} | cut -d' ' -f1)",
              "sha256": "$(cat ${SHA256HASH} | cut -d' ' -f1)"
            }
          }
          EOF
          
          # Set outputs
          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> $GITHUB_OUTPUT
          echo "MD5HASH=${MD5HASH}" >> $GITHUB_OUTPUT
          echo "SHA1HASH=${SHA1HASH}" >> $GITHUB_OUTPUT
          echo "SHA256HASH=${SHA256HASH}" >> $GITHUB_OUTPUT
          echo "METADATA_FILE=${ARTIFACT_NAME}.json" >> $GITHUB_OUTPUT
          
          # Show final package contents
          echo "Package contents:"
          ls -lh "${ZIP_FILENAME}" "${ARTIFACT_NAME}.json" || true

      - name: "Upload build artifacts"
        if: steps.arch_filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_info.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.ZIP_FILENAME }}
            ${{ steps.package.outputs.MD5HASH }}
            ${{ steps.package.outputs.SHA1HASH }}
            ${{ steps.package.outputs.SHA256HASH }}
            ${{ steps.package.outputs.METADATA_FILE }}
          retention-days: 30
          compression-level: 1  # Already compressed
          if-no-files-found: error

      - name: "Upload build logs"
        if: always() && steps.arch_filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "build-logs-${{ matrix.config.arch }}-${{ matrix.config.osname }}"
          path: |
            work/*/output/*.log
            work/*/build.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: "Generate changelog"
        if: steps.arch_filter.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configurationJson: |
            {
              "categories": [
                {"title": "## 🚀 Features", "labels": ["feature", "enhancement"]},
                {"title": "## 🐛 Bug Fixes", "labels": ["fix", "bugfix", "bug"]},
                {"title": "## 🔧 Improvements", "labels": ["improvement", "refactor"]},
                {"title": "## 📚 Documentation", "labels": ["documentation", "docs"]},
                {"title": "## 🧪 Testing", "labels": ["test", "testing"]}
              ],
              "template": "#{{CHANGELOG}}\n\n## Build Information\n- **Architecture:** ${{ matrix.config.arch }}\n- **Debian Release:** ${{ matrix.config.osname }}\n- **Build Date:** ${{ needs.version.outputs.builddate }}\n- **Git Hash:** ${{ needs.version.outputs.buildhash }}\n\n<details>\n<summary>Other Changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>"
            }

      - name: "Create release and upload assets"
        if: steps.arch_filter.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.package.outputs.ZIP_FILENAME }}
          asset_name: ${{ steps.package.outputs.ZIP_FILENAME }}
          tag: ${{ needs.version.outputs.version }}
          release_name: "Crankshaft NG ${{ needs.version.outputs.version }}"
          make_latest: ${{ !contains(needs.version.outputs.version, 'rc') && !contains(needs.version.outputs.version, 'beta') && !contains(needs.version.outputs.version, 'alpha') }}
          prerelease: ${{ contains(needs.version.outputs.version, 'rc') || contains(needs.version.outputs.version, 'beta') || contains(needs.version.outputs.version, 'alpha') }}
          body: |
            ## Crankshaft NG ${{ needs.version.outputs.version }}
            
            ### 📋 Build Details
            - **Architecture:** ${{ matrix.config.arch }}
            - **Debian Release:** ${{ matrix.config.osname }}  
            - **Build Date:** ${{ needs.version.outputs.builddate }}
            - **Git Branch:** ${{ needs.version.outputs.buildbranch }}
            - **Git Hash:** ${{ needs.version.outputs.buildhash }}
            - **Image Size:** ${{ steps.find_image.outputs.image_size || 'See ZIP contents' }}
            
            ### 🔧 Built with Official Raspberry Pi rpi-image-gen
            
            This image was built using the modern [rpi-image-gen](https://github.com/raspberrypi/rpi-image-gen) build system,
            providing better reliability and up-to-date Raspberry Pi support.
            
            ### 📥 Installation Instructions
            
            1. **Download** the ZIP file for your architecture
            2. **Extract** the `.img` file from the ZIP
            3. **Flash** to SD card using [Raspberry Pi Imager](https://www.raspberrypi.com/software/) or `dd`
            4. **Boot** your Raspberry Pi with the new image
            
            ### 🔐 Verification
            
            All releases include checksums for verification:
            - **MD5:** See `.md5` file in the ZIP
            - **SHA1:** See `.sha1` file in the ZIP  
            - **SHA256:** See `.sha256` file in the ZIP
            
            ### 🆘 Support
            
            - [Documentation](https://github.com/opencardev/crankshaft/blob/main/README.md)
            - [Issues](https://github.com/opencardev/crankshaft/issues)
            - [Discussions](https://github.com/opencardev/crankshaft/discussions)
            
            ${{ steps.changelog.outputs.changelog || '' }}

      - name: "Upload checksum files to release"
        if: steps.arch_filter.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: "${{ steps.build_info.outputs.artifact_name }}.*"
          tag: ${{ needs.version.outputs.version }}
          overwrite: true

      - name: "Upload SBOM if available"
        if: steps.arch_filter.outputs.skip != 'true'
        run: |
          # Search for Software Bill of Materials files
          SBOM_FILE=$(find deploy work -name "*.sbom" -o -name "*.spdx*" -o -name "*sbom*" 2>/dev/null | head -1)
          if [ -n "$SBOM_FILE" ] && [ -f "$SBOM_FILE" ]; then
            echo "Found SBOM file: $SBOM_FILE"
            SBOM_NAME="${{ steps.build_info.outputs.artifact_name }}.sbom"
            cp "$SBOM_FILE" "$SBOM_NAME"
            
            # Upload SBOM as release asset if this is a tag build
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              curl -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$SBOM_NAME" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.version.outputs.version }}/assets?name=$SBOM_NAME" || true
            fi
          else
            echo "No SBOM file found"
          fi

  # Summary job that runs after all builds complete
  summary:
    name: "Build Summary"
    runs-on: ubuntu-22.04
    needs: [version, build]
    if: always()
    steps:
      - name: "Build Summary"
        run: |
          echo "# Crankshaft Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** ${{ needs.version.outputs.builddate }}" >> $GITHUB_STEP_SUMMARY
          echo "**Git Hash:** ${{ needs.version.outputs.buildhash }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **Build Status:** Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 All artifacts have been built and uploaded successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💥 Build failed. Check the build logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Crankshaft images for arm64 and armhf architectures" >> $GITHUB_STEP_SUMMARY
          echo "- Checksums (MD5, SHA1, SHA256)" >> $GITHUB_STEP_SUMMARY
          echo "- Build metadata and logs" >> $GITHUB_STEP_SUMMARY