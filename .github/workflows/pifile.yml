name: Crankshaft Build

# Crankshaft automated build using official Raspberry Pi rpi-image-gen
# Builds both arm64 and armhf versions for Debian Bookworm
# Generates release artifacts with checksums and optional SBOM

on:
#  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
      architecture:
        description: 'Target Architecture'
        required: false
        default: 'arm64'
        type: choice
        options:
        - arm64
        - armhf
      debian_release:
        description: 'Debian Release'
        required: false
        default: 'bookworm'
        type: choice
        options:
        - bookworm
        - bullseye
jobs:
  version:
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      buildname: ${{ steps.get_version.outputs.buildname }}
      builddate: ${{ steps.get_version.outputs.builddate }}
      buildbranch: ${{ steps.get_version.outputs.buildbranch }}
      buildhash: ${{ steps.get_version.outputs.buildhash }}
    runs-on: "ubuntu-20.04"
    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v4
      - 
        name: Get the version
        id: get_version
        run: |
          if [ -z "$version" ]
          then
                version=$(date '+%Y%m%d')
                echo "version=${version}" >> $GITHUB_OUTPUT
          else
                echo "version=${version}" >> $GITHUB_OUTPUT
          fi
          builddate=$(date '+%Y-%m-%d')
          buildbranch='crankshaft-ng'
          buildhash=$(git rev-parse --short "$GITHUB_SHA")
          buildname="${builddate}-${buildbranch}-${buildhash}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "buildhash=${buildhash}" >> $GITHUB_OUTPUT
          echo "buildbranch=${buildbranch}" >> $GITHUB_OUTPUT
          echo "builddate=${builddate}" >> $GITHUB_OUTPUT
          echo "buildname=${buildname}" >> $GITHUB_OUTPUT
        env:
          version: ${{ github.event.inputs.version }}
  build:
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    runs-on: ubuntu-latest
    needs: [ version ]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        config:
          - {
              name: "Debian Bookworm arm64",
              arch: "arm64",
              osname: "bookworm",
              ostype: "Debian"
            }
          - {
              name: "Debian Bookworm armhf",
              arch: "armhf", 
              osname: "bookworm",
              ostype: "Debian"
            }
    name: 'Build: ${{ matrix.config.name }}'
    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v4
      - 
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - 
        name: Get the version
        id: get_version
        run: |
          if [ -n "$ostype" ]
          then 
                osname=${ostype}_${osname}
          fi
          echo "version=${version}-${osname}-${arch}" >> $GITHUB_OUTPUT
        env:
          version: ${{needs.version.outputs.version }}
          arch: ${{ matrix.config.arch }}
          ostype: ${{ matrix.config.ostype }}
          osname: ${{ matrix.config.osname }}
      - 
        name: Setup build environment
        run: |
          # Install binfmt support for cross-compilation
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          
          # Verify binfmt is working
          ls -la /proc/sys/fs/binfmt_misc/
          
          # Create config file for this architecture
          cat > config << EOF
          # Crankshaft CI Build Configuration
          IMG_NAME='crankshaft-ng'
          TARGET_ARCH='${{ matrix.config.arch }}'
          DEBIAN_RELEASE='${{ matrix.config.osname }}'
          FIRST_USER_NAME='pi'
          FIRST_USER_PASS='raspberry'
          ENABLE_SSH=0
          DEPLOY_ZIP=1
          VERBOSE=1
          EOF
          
          echo "Generated config file:"
          cat config
      - 
        name: Validate build environment
        run: |
          # Run validation script
          ./scripts/validate-rpi-image-gen.sh || true
          
          # Check Docker
          docker --version
          docker info
      - 
        name: Build Crankshaft image
        run: |
          # Enable verbose output for CI
          export VERBOSE=1
          
          # Run the rpi-image-gen build
          echo "Starting build for ${{ matrix.config.arch }} on ${{ matrix.config.osname }}"
          ./build-docker-rpi-image-gen.sh -a ${{ matrix.config.arch }} -r ${{ matrix.config.osname }} -v
        env:
          DOCKER_BUILDKIT: 1
        timeout-minutes: 120
      - 
        name: Find and rename built image
        id: find_image
        run: |
          echo "Contents of deploy directory:"
          ls -la deploy/ || echo "Deploy directory not found"
          
          # Find the generated image
          IMG_FILE=$(find deploy/ -name "*.img" | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No image file found in deploy/"
            echo "Available files:"
            find . -name "*.img" -o -name "*.zip" | head -20
            exit 1
          fi
          
          echo "Found image file: $IMG_FILE"
          
          # Rename to expected format
          TARGET_NAME="${{steps.get_version.outputs.version}}.img"
          cp "$IMG_FILE" "$TARGET_NAME"
          echo "IMG_FILENAME=${TARGET_NAME}" >> $GITHUB_OUTPUT
          
          # Also handle other files
          for ext in md5 sha1 sha256; do
            SRC_FILE=$(find deploy/ -name "*.$ext" | head -1)
            if [ -f "$SRC_FILE" ]; then
              cp "$SRC_FILE" "${TARGET_NAME}.$ext"
              echo "Copied $SRC_FILE to ${TARGET_NAME}.$ext"
            fi
          done
          
          # Show final file sizes
          echo "Final build artifacts:"
          ls -lh "${TARGET_NAME}"* || true
      - 
        name: Package zip
        id: packagezip
        run: |
          IMG_FILENAME="${{steps.find_image.outputs.IMG_FILENAME}}"
          ZIP_FILENAME="${{steps.get_version.outputs.version}}.zip"
          MD5HASH="${IMG_FILENAME}.md5"
          SHA1HASH="${IMG_FILENAME}.sha1"
          SHA256HASH="${IMG_FILENAME}.sha256"
          
          # Generate checksums if they don't exist
          if [ ! -f "${MD5HASH}" ]; then
            md5sum "${IMG_FILENAME}" > "${MD5HASH}"
          fi
          if [ ! -f "${SHA1HASH}" ]; then
            sha1sum "${IMG_FILENAME}" > "${SHA1HASH}"
          fi
          if [ ! -f "${SHA256HASH}" ]; then
            sha256sum "${IMG_FILENAME}" > "${SHA256HASH}"
          fi
          
          # Create zip archive
          zip "${ZIP_FILENAME}" "${IMG_FILENAME}" "${MD5HASH}" "${SHA1HASH}" "${SHA256HASH}"
          
          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> $GITHUB_OUTPUT
          echo "MD5HASH=${MD5HASH}" >> $GITHUB_OUTPUT
          echo "SHA1HASH=${SHA1HASH}" >> $GITHUB_OUTPUT
          echo "SHA256HASH=${SHA256HASH}" >> $GITHUB_OUTPUT
      - 
        name: Upload build artifacts 
        id: upload_deploy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_version.outputs.version }}
          path: |
            ${{ steps.packagezip.outputs.ZIP_FILENAME }}
            ${{ steps.packagezip.outputs.MD5HASH }}
            ${{ steps.packagezip.outputs.SHA1HASH }}
            ${{ steps.packagezip.outputs.SHA256HASH }}
          retention-days: 30
      - 
        name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config.arch }}-${{ matrix.config.osname }}
          path: |
            work/*/output/*.log
            work/*/build.log
          retention-days: 7
          if-no-files-found: ignore
      - 
        name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.packagezip.outputs.ZIP_FILENAME }}
          asset_name: ${{ steps.packagezip.outputs.ZIP_FILENAME }}
          tag: ${{needs.version.outputs.version }}
          make_latest: false
          prerelease: true
          body: |
            ## Crankshaft NG Build ${{needs.version.outputs.version}}
            
            **Architecture:** ${{ matrix.config.arch }}  
            **Debian Release:** ${{ matrix.config.osname }}
            **Build Date:** ${{needs.version.outputs.builddate}}
            **Git Branch:** ${{needs.version.outputs.buildbranch}}
            **Git Hash:** ${{needs.version.outputs.buildhash}}
            
            ### Built with official Raspberry Pi rpi-image-gen
            
            This image was built using the modern [rpi-image-gen](https://github.com/raspberrypi/rpi-image-gen) build system.
            
            ### Installation
            
            1. Download the ZIP file
            2. Extract the `.img` file
            3. Flash to SD card using [Raspberry Pi Imager](https://www.raspberrypi.com/software/)
            
            ### Checksums
            
            - MD5: See `.md5` file in the ZIP
            - SHA1: See `.sha1` file in the ZIP  
            - SHA256: See `.sha256` file in the ZIP
      - 
        name: Upload SBOM if available
        if: always()
        run: |
          # Check for SBOM files and upload them
          SBOM_FILE=$(find deploy/ -name "*.sbom" | head -1)
          if [ -n "$SBOM_FILE" ]; then
            echo "Found SBOM file: $SBOM_FILE"
            cp "$SBOM_FILE" "${{ steps.get_version.outputs.version }}.sbom"
            
            # Upload SBOM as release asset
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${{ steps.get_version.outputs.version }}.sbom" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/tags/${{needs.version.outputs.version }}/assets?name=${{ steps.get_version.outputs.version }}.sbom" || true
          else
            echo "No SBOM file found"
          fi
